services:
  alloy:
    image: grafana/alloy:v1.17.1
    restart: unless-stopped
    deploy:
      mode: global
    configs:
      - source: alloy_config
        target: /etc/alloy/config.alloy
        mode: 0644
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    # Needed by the built-in cAdvisor/node exporters.
    privileged: true
    pid: host
    mem_limit: 1g
    environment:
      GRAFANA_CLOUD_TOKEN: secret://GRAFANA_CLOUD_TOKEN
      GRAFANA_CLOUD_PROM_URL: secret://GRAFANA_CLOUD_PROM_URL
      GRAFANA_CLOUD_PROM_USER: secret://GRAFANA_CLOUD_PROM_USER
      GRAFANA_CLOUD_LOKI_URL: secret://GRAFANA_CLOUD_LOKI_URL
      GRAFANA_CLOUD_LOKI_USER: secret://GRAFANA_CLOUD_LOKI_USER
      GRAFANA_CLOUD_TEMPO_URL: secret://GRAFANA_CLOUD_TEMPO_URL
      GRAFANA_CLOUD_TEMPO_USER: secret://GRAFANA_CLOUD_TEMPO_USER
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/data/alloy:/var/lib/alloy/data"
      - "/etc/hostname:/etc/host_hostname:ro"
      # Host mounts for the built-in cAdvisor exporter. The host /proc and root
      # filesystem for the node exporter come from pid: host (/proc/1/root).
      # Avoid bind-mounting / or /var/run: they contain sockets, which breaks
      # config injection at deploy time. cAdvisor needs the containerd socket
      # (overlayfs storage driver) to resolve container names/images.
      - "/run/containerd/containerd.sock:/run/containerd/containerd.sock:ro"
      - "/sys:/sys:ro"
      - "/var/lib/docker/:/var/lib/docker:ro"
      - "/dev/disk/:/dev/disk:ro"
    # Alloy UI (optional, LAN-only). Useful for debugging the pipeline.
    x-ports:
      - "12345:12345@host"
      # OTLP trace receivers for local apps (gRPC / HTTP).
      - "4317:4317@host"
      - "4318:4318@host"

  ebpf-autoinstrumenter:
    image: otel/ebpf-instrument:main
    deploy:
      mode: global
    configs:
      - source: obi_config
        target: /etc/obi/config.yml
        mode: 0644
    pid: 'host'
    privileged: true
    environment:
      OTEL_EBPF_TRACE_PRINTER: text
      OTEL_EBPF_CONFIG_PATH: /etc/obi/config.yml
      OTEL_EBPF_IGNORE_ROUTES: "/api/healthcheck,/health,/ready,/metrics,/ping"
      OTEL_EBPF_EXCLUDE_REDIS_COMMANDS: "PING"
      OTEL_TRACES_EXPORTER: "otlp"
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment=prod"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://alloy.internal:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

configs:
  alloy_config:
    file: ./config.alloy
  obi_config:
    file: ./obi-config.yml

secrets:
  GRAFANA_CLOUD_PROM_URL:
    x-command: fnox get GRAFANA_CLOUD_PROM_URL
  GRAFANA_CLOUD_PROM_USER:
    x-command: fnox get GRAFANA_CLOUD_PROM_USER
  GRAFANA_CLOUD_TOKEN:
    x-command: fnox get GRAFANA_CLOUD_TOKEN
  GRAFANA_CLOUD_LOKI_URL:
    x-command: fnox get GRAFANA_CLOUD_LOKI_URL
  GRAFANA_CLOUD_LOKI_USER:
    x-command: fnox get GRAFANA_CLOUD_LOKI_USER
  GRAFANA_CLOUD_TEMPO_URL:
    x-command: fnox get GRAFANA_CLOUD_TEMPO_URL
  GRAFANA_CLOUD_TEMPO_USER:
    x-command: fnox get GRAFANA_CLOUD_TEMPO_USER
